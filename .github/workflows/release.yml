name: Release

# Publishes @franciscosolis/braces to npm when a v* tag is pushed. Authenticates
# with npm trusted publishing (OIDC), so no npm token is stored in GitHub.
# The trusted publisher must be configured on npmjs.com for this repository
# with this workflow file (release.yml) and the npm environment.
#
# Tests run in a separate job without id-token, because the repository has
# no lockfile and devDependencies are resolved at install time. The publish
# job installs nothing, so no third-party code runs next to the OIDC token.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    - run: npm install --ignore-scripts --no-package-lock
    - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Waits for a required reviewer. The name must match the environment set
    # in the npm trusted publisher.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        registry-url: https://registry.npmjs.org
    # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
    - run: npm install -g npm@11.21.0
    - name: Check that the tag matches package.json
      run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
    - run: npm publish --provenance --access public --ignore-scripts
